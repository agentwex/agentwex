name: Release integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.0"
      - name: Verify committed release checksum
        run: cd release && sha256sum --check SHA256SUMS
      - run: npm test
      - name: Install package without lifecycle scripts
        run: |
          install_dir="$(mktemp -d)"
          npm install --prefix "$install_dir" ./release/agentwex-0.6.0.tgz --ignore-scripts
          "$install_dir/node_modules/.bin/agentwex" --version
          "$install_dir/node_modules/.bin/awe" --version
      - name: Rebuild and compare package contents
        run: |
          cp release/agentwex-0.6.0.tgz /tmp/agentwex-committed.tgz
          npm run release
          mkdir /tmp/agentwex-committed /tmp/agentwex-rebuilt
          tar -xzf /tmp/agentwex-committed.tgz -C /tmp/agentwex-committed
          tar -xzf release/agentwex-0.6.0.tgz -C /tmp/agentwex-rebuilt
          diff --recursive --unified /tmp/agentwex-committed /tmp/agentwex-rebuilt
