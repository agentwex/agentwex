name: Live lifecycle smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-lifecycle-smoke
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - run: node scripts/smoke-live-lifecycle.mjs --live
