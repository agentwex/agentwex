[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentwex"
version = "0.0.1"
description = "Reserved Python namespace for Agent WEX; install the Node.js package from npm"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "AgentWex" }]
keywords = ["agents", "compatibility", "evidence", "receipts"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://agentwex.xyz"
Repository = "https://github.com/agentwex/agentwex"

[tool.hatch.build.targets.wheel]
packages = ["src/agentwex"]
